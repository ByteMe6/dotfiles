# windowrule = no_blur, class:^(zoom)$

layerrule = blur on, match:namespace rofi

windowrule = float true, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = size 400 500, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = move 1510 50, match:class ^(org.pulseaudio.pavucontrol)$

windowrule = workspace 41 silent, match:class ^(obsidian)$

windowrule = workspace 2, match:class ^(org.telegram.desktop)$
windowrule = workspace 1, match:class ^(zen)$
