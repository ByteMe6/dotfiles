input {
    kb_layout = us,ru,ua
    kb_options = grp:ctrl_space_toggle
    follow_mouse = 1
    sensitivity = -0.5
    natural_scroll = true
    touchpad {
        tap-to-click = true
        clickfinger_behavior = true
        natural_scroll = true
    }
}
device {
    name = epic-mouse-v1
    natural_scroll = true
    sensitivity = -0.5
}
